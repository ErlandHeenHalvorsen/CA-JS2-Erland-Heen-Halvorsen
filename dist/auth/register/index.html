<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" crossorigin src="../../assets/app-BJZ4ADGI.js"></script>
    <link rel="stylesheet" crossorigin href="../../assets/styles-NZRqTtL3.css">
  </head>

  <body class="body-custom">
    <nav-bar></nav-bar>

    <form class="form-custom" name="register">
      <div class="flex justify-center text-xl text-white">
        <h1>Register</h1>
      </div>
      <div>
        <label class="label-custom" for="name">Name</label>
        <input
          class="input-custom"
          id="name"
          type="text"
          name="name"
          required
          maxlength="20"
          pattern="^[\w]+$"
          title="Please enter a username using only letters and numbers"
        />
      </div>

      <div>
        <label class="label-custom" for="email">Email</label>
        <input
          id="email"
          class="input-custom"
          type="email"
          name="email"
          required
          pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
          title="Please enter a valid noroff.no or stud.noroff.no address"
          placeholder="abc@stud.noroff.no"
        />
      </div>

      <div>
        <label class="label-custom" for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          class="input-custom"
          required
          minlength="8"
          placeholder="xxxxxxxx"
        />
      </div>
      <div class="flex">
        <a class="cta-custom" href="/auth/login/">Login</a>
        <button class="register-custom">Register</button>
      </div>
    </form>
  </body>
</html>
