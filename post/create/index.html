<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <header class="bg-gray-800">
      <div
        class="container mx-auto flex justify-between items-center p-4 md:p-6 lg:p-8"
      >
        <div>
          <a class="hover:scale-105" href="/">
            <img src="/images/noroff-logo.png" alt="Noroff Logo" />
          </a>
        </div>
        <!-- Desktop Menu -->
        <div class="text-xl">
          <nav class="hidden md:block">
            <a class="custom-nav" href="/">Home</a>
            <a class="custom-nav" href="/profile/">Profile</a>
            <a class="custom-nav" href="/auth/login/">Login</a>
            <a class="custom-nav" href="/auth/register/">Register</a>
            <a class="custom-nav" href="/post/create/">Post</a>
            <button title="Logout" id="logout" class="">Logout</button>
          </nav>
          <!-- SVG -->
          <div class="flex md:hidden">
            <button
              id="menu-btn"
              class="focus:outline-none p-1 m-0 ml-6"
              aria-label="toggle menu"
              aria-expanded="false"
            >
              <svg
                class="w-8 h-8 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16m-7 6h7"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- Mobile Menu -->
      <div id="mobile-menu" class="bg-gray-800 m-0 hidden md:hidden">
        <nav class="flex flex-col text-center space-y-2 p-4">
          <a class="custom-nav-mobile" href="/">Home</a>
          <a class="custom-nav-mobile" href="/profile/">Profile</a>
          <a class="custom-nav-mobile" href="/auth/login/">Login</a>
          <a class="custom-nav-mobile" href="/auth/register/">Register</a>
          <a class="custom-nav-mobile" href="/post/create/">Post</a>
          <button
            title="Logout"
            id="logout"
            class="p-1 w-fit relative left-1 rounded bg-orange-700"
          >
            Logout
          </button>
        </nav>
      </div>
    </header>
    <h1>Create Post</h1>
    <form name="createPost">
      <div>
        <label for="title">Title</label>
        <input
          id="title"
          type="text"
          name="title"
          placeholder="Post Title"
          required
        />
      </div>
      <div>
        <label for="body">Body</label>
        <textarea
          id="body"
          name="body"
          placeholder="Post Body"
          maxlength="200"
        ></textarea>
      </div>
      <div>
        <label for="tags">Tags</label>
        <input id="tags" type="text" name="tags" />
      </div>
      <div>
        <label for="media">Media</label>
        <input id="media" type="text" name="media" />
        <input id="mediaAlt" type="text" name="media-alt" />
      </div>

      <button>Create Post</button>
    </form>
  </body>
</html>
