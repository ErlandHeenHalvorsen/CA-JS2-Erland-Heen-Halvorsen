<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
    <link rel="stylesheet" href="/dist/styles.css" />
    
  </head>
  <body class="bg-gray-600">
    <nav-bar></nav-bar>
    <h1 class="font-bold">Create Post</h1>
    <form
      class="max-w-md mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg"
      name="createPost"
    >
      <div class="mb-5">
        <label
          for="title"
          class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
          >Title</label
        >
        <input
          id="title"
          type="text"
          name="title"
          placeholder="Post Title"
          required
          class="w-full px-4 py-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        />
      </div>

      <div class="mb-5">
        <label
          for="body"
          class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
          >Body</label
        >
        <textarea
          id="body"
          name="body"
          placeholder="Post Body"
          maxlength="200"
          class="w-full px-4 py-2 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        ></textarea>
      </div>

      <div class="mb-5">
        <label
          for="tags"
          class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
          >Tags</label
        >
        <input
          id="tags"
          type="text"
          name="tags"
          placeholder="e.g., travel, photography"
          class="w-full px-4 py-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        />
      </div>

      <div class="mb-5">
        <label
          for="media"
          class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
          >Media</label
        >
        <input
          id="media"
          type="text"
          name="media"
          placeholder="Media URL"
          class="w-full px-4 py-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        />
      </div>

      <div class="mb-5">
        <label
          for="mediaAlt"
          class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
          >Media Alt Text</label
        >
        <input
          id="mediaAlt"
          type="text"
          name="media-alt"
          placeholder="Description of the media"
          class="w-full px-4 py-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        />
      </div>

      <button
        type="submit"
        class="cta-custom w-full py-2 mt-4 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-all duration-200"
      >
        Create Post
      </button>
    </form>
  </body>
</html>
